# Local Postgres 16 for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluslate
      POSTGRES_PASSWORD: bluslate
      POSTGRES_DB: bluslate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluslate"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
