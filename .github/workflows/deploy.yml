name: Deploy

# Production deploys of bluslate.yoppi.in (decision 0007).
# Runs after CI passes on main, or by hand from the Actions tab. It applies
# database migrations first, then builds on the runner and ships the build to Vercel.
# Vercel's own Git deploys are off (apps/web/vercel.json), so this is the only path.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Check deploy settings
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not deploying: add these repository secrets first:$missing (see docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Migrate and deploy to Vercel
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bluslate.yoppi.in
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just passed, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:deploy
        env:
          # Neon's direct (unpooled) connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Pull Vercel project settings and production env
        run: pnpm dlx vercel@65.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: pnpm dlx vercel@65.9.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          url=$(pnpm dlx vercel@65.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check the live site
        # Doesn't fail the deploy: the domain may not point at Vercel yet.
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://bluslate.yoppi.in/ || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::https://bluslate.yoppi.in/ did not answer 200. Check the domain in Vercel."
          exit 1
